name: Release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  REDOCLY_TELEMETRY: "off"

jobs:
  retrieval:
    name: Retrieval lint, test, and corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: dishly-addon/requirements.lock

      - name: Install locked Python dependencies
        run: python -m pip install --requirement dishly-addon/requirements.lock

      - name: Install the retrieval package
        working-directory: dishly-addon
        run: python -m pip install --no-deps --editable .

      - name: Lint retrieval code
        working-directory: dishly-addon
        run: python -m ruff check dishly_retrieval tests scripts

      - name: Run retrieval tests and coverage gate
        working-directory: dishly-addon
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report

      - name: Validate the reviewed recipe corpus
        working-directory: dishly-addon
        run: python -m dishly_retrieval validate

  api:
    name: API tests, coverage, and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install repository tools
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix backend

      - name: Run API tests
        run: npm --prefix backend test

      - name: Enforce API coverage
        run: npm --prefix backend run test:coverage

      - name: Lint the OpenAPI contract
        run: npx redocly lint backend/openapi.yaml

      - name: Audit API production dependencies
        run: npm --prefix backend audit --omit=dev --audit-level=high

  frontend:
    name: UI unit, build, and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install API dependencies for full-stack E2E
        run: npm ci --prefix backend

      - name: Install UI dependencies
        run: npm ci --prefix frontend

      - name: Lint the UI
        run: npm --prefix frontend run lint

      - name: Run UI tests and coverage gate
        run: npm --prefix frontend run test:coverage

      - name: Build the production UI
        run: npm --prefix frontend run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm --prefix frontend run test:e2e

      - name: Run Express and UI full-stack journey
        run: npm --prefix frontend run test:e2e:fullstack

      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  production-artifacts:
    name: Deployment schemas and Linux image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.10"

      - name: Install schema validator
        run: python -m pip install check-jsonschema==0.37.3

      - name: Validate the GitHub workflow
        run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/release-gate.yml

      - name: Validate the Render Blueprint
        run: check-jsonschema --schemafile https://render.com/schema/render.yaml.json render.yaml

      - name: Validate the Vercel configuration
        # Vercel declares draft-04 but currently publishes draft-07 keywords
        # such as `const`; selecting Draft7 validates its actual vocabulary.
        run: >-
          check-jsonschema
          --validator-class jsonschema.validators:Draft7Validator
          --schemafile https://openapi.vercel.sh/vercel.json
          frontend/vercel.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Test the production verifier
        run: node --test scripts/verify-production.test.mjs

      - name: Build the exact Render retrieval image
        run: docker build --file deploy/render/retrieval.Dockerfile --tag dishly-retrieval:${{ github.sha }} .

      - name: Validate the corpus packaged in the image
        run: docker run --rm --entrypoint python dishly-retrieval:${{ github.sha }} -m dishly_retrieval validate

      - name: Smoke-test the packaged Ollama runtime
        run: docker run --rm --entrypoint ollama dishly-retrieval:${{ github.sha }} --version

  release-gate:
    name: Release gate
    if: always()
    needs:
      - retrieval
      - api
      - frontend
      - production-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release check
        env:
          API_RESULT: ${{ needs.api.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PRODUCTION_RESULT: ${{ needs.production-artifacts.result }}
          RETRIEVAL_RESULT: ${{ needs.retrieval.result }}
        run: |
          for result in "$API_RESULT" "$FRONTEND_RESULT" "$PRODUCTION_RESULT" "$RETRIEVAL_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required release job ended with: $result"
              exit 1
            fi
          done
          echo "Every release job passed."
