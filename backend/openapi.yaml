openapi: 3.1.0
info:
  title: Recipe Match Backend API
  version: 1.5.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-UNLICENSED
  description: |
    Backend contract for natural-language goal parsing, memory/PostgreSQL goal and
    swipe storage, and normalized local-retrieval recipe data. The public API has
    no authentication; production deployments use persistent storage.
servers:
  - url: /api
    description: API path on the selected backend origin
tags:
  - name: Operations
    description: Process liveness and configuration readiness.
  - name: Goals
    description: Natural-language goal parsing and current-goal storage.
  - name: Recipes
    description: Validated local-corpus search and detail data.
  - name: Swipes
    description: Recipe preference recording in the selected storage repository.
security: []
paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Check process liveness
      description: Does not validate configuration or contact upstream services.
      responses:
        "200":
          description: The process can serve HTTP requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: true
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Check local recipe-service readiness
      description: |
        Contacts the private retrieval service and selected storage repository.
        Retrieval readiness includes the corpus, parser model, embedding model,
        and vector index state.
      responses:
        "200":
          description: Local parsing and retrieval report ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                ok: true
                services:
                  retrieval: true
                  storage: true
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "503":
          description: Local parsing or retrieval is unavailable/not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                ok: false
                services:
                  retrieval: false
                  storage: true
        "500":
          $ref: "#/components/responses/InternalError"
  /parse-goal:
    post:
      tags: [Goals]
      operationId: parseGoal
      summary: Parse a natural-language food goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseGoalRequest"
            example:
              text: cozy Japanese dessert, no peanuts, under 600 calories
      responses:
        "200":
          description: The normalized filter parsed by local Ollama and safety code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseGoalResponse"
              example:
                parsedFilter:
                  query: cozy
                  maxCalories: 600
                  cuisines: [japanese, italian]
                  mealType: dessert
                  intolerances: [peanut]
                  excludeIngredients: [peanuts]
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /goal:
    post:
      tags: [Goals]
      operationId: saveGoal
      summary: Save or replace a user's current goal
      description: The saved goal is process-local and is erased on restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveGoalRequest"
            example:
              userId: demo-user-1
              rawText: cozy Japanese dessert, no peanuts, under 600 calories
              parsedFilter:
                query: cozy
                maxCalories: 600
                cuisines: [japanese, italian]
                mealType: dessert
                intolerances: [peanut]
                excludeIngredients: [peanuts]
      responses:
        "200":
          description: Goal saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /goal/current:
    get:
      tags: [Goals]
      operationId: getCurrentGoal
      summary: Get a user's current goal
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The current goal, or JSON null when no goal is stored.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Goal"
                  - type: "null"
              examples:
                found:
                  value:
                    rawText: Japanese dinner, no peanuts
                    parsedFilter:
                      cuisines: [japanese, italian]
                      mealType: main course
                      intolerances: [peanut]
                      excludeIngredients: [peanuts]
                    updatedAt: "2026-07-11T16:00:00.000Z"
                missing:
                  value: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /recipes:
    get:
      tags: [Recipes]
      operationId: searchRecipes
      summary: Search recipes for a user's current goal
      description: >-
        Uses an unconstrained request if the user has no saved goal. Closest
        mode must be requested explicitly and never relaxes vegan, allergen,
        named-ingredient, or same-goal swipe exclusions.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/MatchMode"
      responses:
        "200":
          description: One normalized page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipePage"
              example:
                recipes: []
                pagination:
                  limit: 10
                  offset: 0
                  count: 0
                  hasMore: false
                match:
                  mode: exact
                  canShowClosest: true
                  message: No exact matches were found.
                  totalCandidates: 0
                  semanticProvider: ollama:embeddinggemma
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /recipes/{id}:
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get one normalized recipe
      parameters:
        - $ref: "#/components/parameters/RecipeIdPath"
      responses:
        "200":
          description: A normalized recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /swipe:
    post:
      tags: [Swipes]
      operationId: addSwipe
      summary: Record an in-memory swipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
            example:
              userId: demo-user-1
              recipeId: "12345"
              direction: right
      responses:
        "200":
          description: Swipe recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    UserId:
      name: userId
      in: query
      required: true
      description: Caller-supplied demo identity. It must be provided exactly once.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: demo-user-1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum recipes requested for this page.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based ranked-corpus result offset.
      schema:
        type: integer
        minimum: 0
        maximum: 900
        default: 0
    MatchMode:
      name: matchMode
      in: query
      required: false
      description: >-
        Exact matching is the default. Closest matching is an explicit second
        request and still preserves every hard safety/diet exclusion.
      schema:
        type: string
        enum: [exact, closest]
        default: exact
    RecipeIdPath:
      name: id
      in: path
      required: true
      description: Canonical positive safe-integer corpus recipe identifier without leading zeroes.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 32
      example: "12345"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    Readiness:
      type: object
      additionalProperties: false
      required: [ok, services]
      properties:
        ok:
          type: boolean
        services:
          type: object
          additionalProperties: false
          required: [retrieval, storage]
          properties:
            retrieval:
              type: boolean
            storage:
              type: boolean
    ParseGoalRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: Must contain a non-whitespace character after trimming.
    ParseGoalResponse:
      type: object
      additionalProperties: false
      required: [parsedFilter]
      properties:
        parsedFilter:
          $ref: "#/components/schemas/GoalFilter"
    GoalFilter:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 160
          description: Specific dish, ingredient, flavor, or style inferred from the natural-language craving.
        minCalories:
          type: integer
          minimum: 0
          maximum: 10000
          description: Minimum calories per serving.
        maxCalories:
          type: integer
          minimum: 1
          maximum: 10000
          description: Maximum calories per serving.
        minProtein_g:
          type: integer
          minimum: 0
          maximum: 500
          description: Minimum protein grams per serving.
        maxProtein_g:
          type: integer
          minimum: 0
          maximum: 500
          description: Maximum protein grams per serving.
        minCarbs_g:
          type: integer
          minimum: 0
          maximum: 1000
          description: Minimum carbohydrate grams per serving.
        maxCarbs_g:
          type: integer
          minimum: 0
          maximum: 1000
          description: Maximum carbohydrate grams per serving.
        diet:
          type: string
          enum:
            - gluten free
            - ketogenic
            - vegetarian
            - lacto-vegetarian
            - ovo-vegetarian
            - vegan
            - pescetarian
            - paleo
            - primal
            - low fodmap
            - whole30
        cuisines:
          type: array
          minItems: 1
          maxItems: 27
          items:
            type: string
            enum:
              - african
              - asian
              - american
              - british
              - cajun
              - caribbean
              - chinese
              - eastern european
              - european
              - french
              - german
              - greek
              - indian
              - irish
              - italian
              - japanese
              - jewish
              - korean
              - latin american
              - mediterranean
              - mexican
              - middle eastern
              - nordic
              - southern
              - spanish
              - thai
              - vietnamese
          description: One or more canonical supported cuisines. Multiple values are OR alternatives.
        mealType:
          type: string
          enum: [breakfast, main course, dessert]
          description: Breakfast, a substantial lunch/dinner meal, or dessert.
        maxReadyTime:
          type: integer
          minimum: 1
          maximum: 1440
          description: Minutes.
        intolerances:
          type: array
          maxItems: 12
          items:
            type: string
            enum: [dairy, egg, gluten, grain, peanut, seafood, sesame, shellfish, soy, sulfite, tree nut, wheat]
          description: Hard allergy/intolerance exclusions sent to local retrieval. Results still require ingredient and cross-contact verification.
        excludeIngredients:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
          description: Entries are trimmed and deduplicated case-insensitively.
    SaveGoalRequest:
      type: object
      required: [userId, rawText]
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        rawText:
          type: string
          minLength: 1
          maxLength: 1000
          description: Must contain a non-whitespace character after trimming.
        parsedFilter:
          $ref: "#/components/schemas/GoalFilter"
    Goal:
      type: object
      additionalProperties: false
      required: [rawText, parsedFilter, updatedAt]
      properties:
        rawText:
          type: string
          minLength: 1
          maxLength: 1000
        parsedFilter:
          $ref: "#/components/schemas/GoalFilter"
        updatedAt:
          type: string
          format: date-time
          description: Monotonically unique saved-goal/deck version for this user.
    Recipe:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - image
        - readyInMinutes
        - servings
        - calories
        - macros
        - diets
        - ingredients
        - instructions
        - sourceName
        - sourceUrl
      properties:
        id:
          type: string
          pattern: "^[1-9][0-9]*$"
          maxLength: 32
          description: >-
            Canonical positive JavaScript-safe integer encoded as a string,
            without leading zeroes.
        title:
          type: string
          minLength: 1
        image:
          type: string
          description: >-
            Safe absolute HTTP(S) image URL without credentials. Empty string
            when unavailable.
        readyInMinutes:
          type: [integer, "null"]
          minimum: 0
        servings:
          type: [number, "null"]
          minimum: 0
        calories:
          type: [number, "null"]
          minimum: 0
          description: Publisher calories per serving when available.
        macros:
          $ref: "#/components/schemas/Macros"
        diets:
          type: array
          items:
            type: string
        ingredients:
          type: array
          description: Plain-text ingredient lines retained from the reviewed source.
          items:
            type: string
            minLength: 1
        instructions:
          type: array
          description: Plain-text recipe steps when the reviewed corpus includes them.
          items:
            type: string
            minLength: 1
        sourceName:
          type: string
          description: Publisher/source attribution label when available.
        sourceUrl:
          type: string
          description: >-
            Safe absolute HTTP(S) publisher URL without credentials. Empty
            string when unavailable.
        match:
          $ref: "#/components/schemas/RecipeMatch"
    RecipeMatch:
      type: object
      additionalProperties: false
      required: [mode, score, reasons]
      properties:
        mode:
          type: string
          enum: [exact, closest]
        score:
          type: [number, "null"]
          description: Private retrieval score when supplied; null otherwise.
        reasons:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 300
    Macros:
      type: object
      additionalProperties: false
      required: [protein_g, carbs_g, fat_g]
      properties:
        protein_g:
          type: [number, "null"]
          minimum: 0
          description: Publisher grams per serving when available.
        carbs_g:
          type: [number, "null"]
          minimum: 0
          description: Publisher grams per serving when available.
        fat_g:
          type: [number, "null"]
          minimum: 0
          description: Publisher grams per serving when available.
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, count, hasMore]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 20
        offset:
          type: integer
          minimum: 0
          maximum: 900
        count:
          type: integer
          minimum: 0
          maximum: 20
          description: Number of recipes returned in this page, not total matches.
        hasMore:
          type: boolean
          description: >-
            Whether another page can be requested within the supported offset
            range, derived from the retrieval service's validated candidate count.
    RecipePage:
      type: object
      additionalProperties: false
      required: [recipes, pagination, match]
      properties:
        recipes:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Recipe"
        pagination:
          $ref: "#/components/schemas/Pagination"
        match:
          $ref: "#/components/schemas/SearchMatch"
    SearchMatch:
      type: object
      additionalProperties: false
      required: [mode, canShowClosest, message, totalCandidates, semanticProvider]
      properties:
        mode:
          type: string
          enum: [exact, closest]
        canShowClosest:
          type: boolean
          description: Whether the UI may offer a separate closest-mode request.
        message:
          type: [string, "null"]
          maxLength: 500
        totalCandidates:
          type: integer
          minimum: 0
          description: Total ranked candidates before page slicing.
        semanticProvider:
          type: string
          minLength: 1
          maxLength: 200
    UserId:
      type: string
      minLength: 1
      maxLength: 128
      description: Must contain a non-whitespace character after trimming.
    SwipeRequest:
      type: object
      required: [userId, recipeId, direction]
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        recipeId:
          type: string
          pattern: "^[1-9][0-9]*$"
          maxLength: 32
          description: >-
            Canonical positive JavaScript-safe integer encoded as a string,
            without leading zeroes.
        direction:
          type: string
          enum: [left, right]
    Success:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          minLength: 1
  responses:
    BadRequest:
      description: Request validation failed or the JSON body is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid request
    CorsForbidden:
      description: The browser origin is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Origin not allowed by CORS
    NotFound:
      description: The requested recipe or API route was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Recipe not found
    PayloadTooLarge:
      description: The JSON request body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Request body is too large
    UpstreamError:
      description: The private local service failed or returned an invalid response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Provider is temporarily unavailable
    ServiceUnavailable:
      description: Local Ollama, its models, the corpus, or private retrieval is not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Provider is not configured
    GatewayTimeout:
      description: An upstream request exceeded its configured timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Provider request timed out
    InternalError:
      description: An unexpected backend failure occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Unexpected server error
