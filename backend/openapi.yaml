openapi: 3.1.0
info:
  title: Recipe Match Backend API
  version: 2.0.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-UNLICENSED
  description: |
    Backend contract for natural-language goal parsing, in-memory guest goal and
    swipe storage, normalized Spoonacular data, and the optional authenticated
    Supabase recipe library. Guest mode does not require an account service.
servers:
  - url: /api
    description: API path on the selected backend origin
tags:
  - name: Operations
    description: Process liveness and configuration readiness.
  - name: Goals
    description: Natural-language goal parsing and current-goal storage.
  - name: Recipes
    description: Normalized Spoonacular search and detail data.
  - name: Swipes
    description: In-memory recipe preference recording.
  - name: Accounts
    description: Optional authenticated recipe library and account controls.
security: []
paths:
  /auth/config:
    get:
      tags: [Accounts]
      operationId: getAuthConfig
      summary: Discover optional public account configuration
      responses:
        "200":
          description: Disabled, or enabled with the intentionally public Supabase URL and publishable key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
        "403": { $ref: "#/components/responses/CorsForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /me:
    get:
      tags: [Accounts]
      operationId: getCurrentAccount
      summary: Get the authenticated user's bounded public profile
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Current account identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /saved-recipes:
    get:
      tags: [Accounts]
      operationId: listSavedRecipes
      summary: List the authenticated user's saved recipes
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: Private saved recipe page, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [recipes, pagination]
                properties:
                  recipes: { type: array, items: { $ref: "#/components/schemas/SavedRecipe" } }
                  pagination: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /saved-recipes/import:
    post:
      tags: [Accounts]
      operationId: importGuestRecipes
      summary: Idempotently import up to 200 guest recipe snapshots
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipes]
              properties:
                recipes: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Recipe" } }
      responses:
        "200": { description: Import accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /saved-recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/AccountRecipeId"
    put:
      tags: [Accounts]
      operationId: saveRecipe
      summary: Idempotently save one recipe snapshot
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties: { recipe: { $ref: "#/components/schemas/Recipe" } }
      responses:
        "200": { description: Saved recipe, content: { application/json: { schema: { $ref: "#/components/schemas/SavedRecipe" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Accounts]
      operationId: updateSavedRecipe
      summary: Update private notes and/or rating
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 2000 }
                rating: { type: [integer, "null"], minimum: 1, maximum: 5 }
      responses:
        "200": { description: Updated recipe. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Accounts]
      operationId: removeSavedRecipe
      summary: Remove one saved recipe
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Removed or already absent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /collections:
    get:
      tags: [Accounts]
      operationId: listCollections
      summary: List private collections
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: Collections. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Accounts]
      operationId: createCollection
      summary: Create a private collection
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "201": { description: Collection created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    patch:
      tags: [Accounts]
      operationId: updateCollection
      summary: Update a private collection
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CollectionInput" } } }
      responses:
        "200": { description: Collection updated. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Accounts]
      operationId: deleteCollection
      summary: Delete a private collection
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Deleted or already absent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /collections/{collectionId}/recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
      - $ref: "#/components/parameters/AccountRecipeId"
    put:
      tags: [Accounts]
      operationId: addRecipeToCollection
      summary: Idempotently add a saved recipe to a collection
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Membership present. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Accounts]
      operationId: removeRecipeFromCollection
      summary: Remove a recipe from a collection
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Membership absent. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /account/export:
    get:
      tags: [Accounts]
      operationId: exportAccount
      summary: Download all private Dishly account data as JSON
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: JSON attachment. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /account:
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Permanently delete the authenticated account
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties: { confirmation: { type: string, const: DELETE } }
      responses:
        "204": { description: Account and cascading data deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Check process liveness
      description: Does not validate configuration or contact providers.
      responses:
        "200":
          description: The process can serve HTTP requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: true
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Check provider configuration readiness
      description: |
        Checks only whether both API key environment variables are nonblank. It
        does not contact Gemini or Spoonacular. The same response schema is used
        for ready and not-ready states.
      responses:
        "200":
          description: Both provider keys are configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                ok: true
                services:
                  gemini: true
                  spoonacular: true
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "503":
          description: At least one provider key is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                ok: false
                services:
                  gemini: false
                  spoonacular: true
        "500":
          $ref: "#/components/responses/InternalError"
  /parse-goal:
    post:
      tags: [Goals]
      operationId: parseGoal
      summary: Parse a natural-language food goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseGoalRequest"
            example:
              text: cozy Japanese dessert, no peanuts, under 600 calories
      responses:
        "200":
          description: The normalized filter parsed by Gemini, with explicit bounds deterministically enforced and a bounded deterministic fallback for clear supported goals when Gemini is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseGoalResponse"
              example:
                parsedFilter:
                  query: cozy
                  maxCalories: 600
                  cuisines: [japanese, italian]
                  mealType: dessert
                  intolerances: [peanut]
                  excludeIngredients: [peanuts]
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /goal:
    post:
      tags: [Goals]
      operationId: saveGoal
      summary: Save or replace a user's current goal
      description: The saved goal is process-local and is erased on restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveGoalRequest"
            example:
              userId: demo-user-1
              rawText: cozy Japanese dessert, no peanuts, under 600 calories
              parsedFilter:
                query: cozy
                maxCalories: 600
                cuisines: [japanese, italian]
                mealType: dessert
                intolerances: [peanut]
                excludeIngredients: [peanuts]
      responses:
        "200":
          description: Goal saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /goal/current:
    get:
      tags: [Goals]
      operationId: getCurrentGoal
      summary: Get a user's current goal
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The current goal, or JSON null when no goal is stored.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Goal"
                  - type: "null"
              examples:
                found:
                  value:
                    rawText: Japanese dinner, no peanuts
                    parsedFilter:
                      cuisines: [japanese, italian]
                      mealType: main course
                      intolerances: [peanut]
                      excludeIngredients: [peanuts]
                    updatedAt: "2026-07-11T16:00:00.000Z"
                missing:
                  value: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /recipes:
    get:
      tags: [Recipes]
      operationId: searchRecipes
      summary: Search recipes for a user's current goal
      description: Uses an empty filter if the user has no saved goal. Recipes outside saved numeric nutrition or time bounds, or missing values needed to verify those bounds, are omitted.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One normalized page of recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipePage"
              example:
                recipes: []
                pagination:
                  limit: 10
                  offset: 0
                  count: 0
                  hasMore: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /recipes/{id}:
    get:
      tags: [Recipes]
      operationId: getRecipe
      summary: Get one normalized recipe
      parameters:
        - $ref: "#/components/parameters/RecipeIdPath"
      responses:
        "200":
          description: A normalized recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /swipe:
    post:
      tags: [Swipes]
      operationId: addSwipe
      summary: Record an in-memory swipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
            example:
              userId: demo-user-1
              recipeId: "12345"
              direction: right
      responses:
        "200":
          description: Swipe recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CorsForbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
  parameters:
    AccountRecipeId:
      name: recipeId
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]{0,31}$" }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: query
      required: true
      description: Caller-supplied demo identity. It must be provided exactly once.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: demo-user-1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum recipes requested for this page.
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based Spoonacular result offset.
      schema:
        type: integer
        minimum: 0
        maximum: 900
        default: 0
    RecipeIdPath:
      name: id
      in: path
      required: true
      description: Canonical positive safe-integer Spoonacular recipe identifier without leading zeroes.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 32
      example: "12345"
  schemas:
    AuthConfig:
      oneOf:
        - type: object
          required: [enabled]
          properties: { enabled: { type: boolean, const: false } }
        - type: object
          required: [enabled, url, publishableKey]
          properties:
            enabled: { type: boolean, const: true }
            url: { type: string, format: uri }
            publishableKey: { type: string, minLength: 1 }
    AccountProfile:
      type: object
      required: [id, email, displayName, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string, maxLength: 100 }
        avatarUrl: { type: string }
    SavedRecipe:
      type: object
      description: Sanitized Recipe fields plus private savedId, notes, rating, savedAt, and updatedAt metadata.
    CollectionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
    Health:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    Readiness:
      type: object
      additionalProperties: false
      required: [ok, services]
      properties:
        ok:
          type: boolean
        services:
          type: object
          additionalProperties: false
          required: [gemini, spoonacular]
          properties:
            gemini:
              type: boolean
            spoonacular:
              type: boolean
    ParseGoalRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: Must contain a non-whitespace character after trimming.
    ParseGoalResponse:
      type: object
      additionalProperties: false
      required: [parsedFilter]
      properties:
        parsedFilter:
          $ref: "#/components/schemas/GoalFilter"
    GoalFilter:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 160
          description: Specific dish, ingredient, flavor, or style inferred from the natural-language craving.
        minCalories:
          type: integer
          minimum: 0
          maximum: 10000
          description: Minimum calories per serving.
        maxCalories:
          type: integer
          minimum: 1
          maximum: 10000
          description: Maximum calories per serving.
        minProtein_g:
          type: integer
          minimum: 0
          maximum: 500
          description: Minimum protein grams per serving.
        maxProtein_g:
          type: integer
          minimum: 0
          maximum: 500
          description: Maximum protein grams per serving.
        minCarbs_g:
          type: integer
          minimum: 0
          maximum: 1000
          description: Minimum carbohydrate grams per serving.
        maxCarbs_g:
          type: integer
          minimum: 0
          maximum: 1000
          description: Maximum carbohydrate grams per serving.
        diet:
          type: string
          enum:
            - gluten free
            - ketogenic
            - vegetarian
            - lacto-vegetarian
            - ovo-vegetarian
            - vegan
            - pescetarian
            - paleo
            - primal
            - low fodmap
            - whole30
        cuisines:
          type: array
          minItems: 1
          maxItems: 27
          items:
            type: string
            enum:
              - african
              - asian
              - american
              - british
              - cajun
              - caribbean
              - chinese
              - eastern european
              - european
              - french
              - german
              - greek
              - indian
              - irish
              - italian
              - japanese
              - jewish
              - korean
              - latin american
              - mediterranean
              - mexican
              - middle eastern
              - nordic
              - southern
              - spanish
              - thai
              - vietnamese
          description: One or more canonical Spoonacular cuisines. Multiple values are OR alternatives.
        mealType:
          type: string
          enum: [breakfast, main course, dessert]
          description: Breakfast, a substantial lunch/dinner meal, or dessert.
        maxReadyTime:
          type: integer
          minimum: 1
          maximum: 1440
          description: Minutes.
        intolerances:
          type: array
          maxItems: 12
          items:
            type: string
            enum: [dairy, egg, gluten, grain, peanut, seafood, sesame, shellfish, soy, sulfite, tree nut, wheat]
          description: Allergy/intolerance categories sent to Spoonacular's safety filter. Results still require ingredient and cross-contact verification.
        excludeIngredients:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
          description: Entries are trimmed and deduplicated case-insensitively.
    SaveGoalRequest:
      type: object
      required: [userId, rawText]
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        rawText:
          type: string
          minLength: 1
          maxLength: 1000
          description: Must contain a non-whitespace character after trimming.
        parsedFilter:
          $ref: "#/components/schemas/GoalFilter"
    Goal:
      type: object
      additionalProperties: false
      required: [rawText, parsedFilter, updatedAt]
      properties:
        rawText:
          type: string
          minLength: 1
          maxLength: 1000
        parsedFilter:
          $ref: "#/components/schemas/GoalFilter"
        updatedAt:
          type: string
          format: date-time
    Recipe:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - image
        - readyInMinutes
        - servings
        - calories
        - macros
        - diets
        - ingredients
        - instructions
        - sourceName
        - sourceUrl
      properties:
        id:
          type: string
          pattern: "^[1-9][0-9]*$"
          maxLength: 32
          description: >-
            Canonical positive JavaScript-safe integer encoded as a string,
            without leading zeroes.
        title:
          type: string
          minLength: 1
        image:
          type: string
          description: >-
            Safe absolute HTTP(S) image URL without credentials. Empty string
            when unavailable.
        readyInMinutes:
          type: [integer, "null"]
          minimum: 0
        servings:
          type: [integer, "null"]
          minimum: 0
        calories:
          type: [integer, "null"]
          minimum: 0
          description: Rounded calories per serving.
        macros:
          $ref: "#/components/schemas/Macros"
        diets:
          type: array
          items:
            type: string
        ingredients:
          type: array
          description: Plain-text ingredient lines normalized from Spoonacular.
          items:
            type: string
            minLength: 1
        instructions:
          type: array
          description: Plain-text recipe steps normalized from Spoonacular.
          items:
            type: string
            minLength: 1
        sourceName:
          type: string
          description: Provider/source attribution label when available.
        sourceUrl:
          type: string
          description: >-
            Safe absolute HTTP(S) source URL without credentials, using the
            Spoonacular recipe page as a fallback. Empty string when unavailable.
    Macros:
      type: object
      additionalProperties: false
      required: [protein_g, carbs_g, fat_g]
      properties:
        protein_g:
          type: [integer, "null"]
          minimum: 0
          description: Rounded grams per serving.
        carbs_g:
          type: [integer, "null"]
          minimum: 0
          description: Rounded grams per serving.
        fat_g:
          type: [integer, "null"]
          minimum: 0
          description: Rounded grams per serving.
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, count, hasMore]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 20
        offset:
          type: integer
          minimum: 0
          maximum: 900
        count:
          type: integer
          minimum: 0
          maximum: 20
          description: Number of recipes returned in this page, not total matches.
        hasMore:
          type: boolean
          description: >-
            Whether another page can be requested within the supported offset
            range. This is based on Spoonacular pagination metadata or, when that
            metadata is invalid, whether the raw provider page was full.
    RecipePage:
      type: object
      additionalProperties: false
      required: [recipes, pagination]
      properties:
        recipes:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Recipe"
        pagination:
          $ref: "#/components/schemas/Pagination"
    UserId:
      type: string
      minLength: 1
      maxLength: 128
      description: Must contain a non-whitespace character after trimming.
    SwipeRequest:
      type: object
      required: [userId, recipeId, direction]
      properties:
        userId:
          $ref: "#/components/schemas/UserId"
        recipeId:
          type: string
          pattern: "^[1-9][0-9]*$"
          maxLength: 32
          description: >-
            Canonical positive JavaScript-safe integer encoded as a string,
            without leading zeroes.
        direction:
          type: string
          enum: [left, right]
    Success:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          minLength: 1
  responses:
    Unauthorized:
      description: A valid Supabase bearer session is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Request validation failed or the JSON body is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Invalid request
    CorsForbidden:
      description: The browser origin is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Origin not allowed by CORS
    NotFound:
      description: The requested recipe or API route was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Recipe not found
    PayloadTooLarge:
      description: The JSON request body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Request body is too large
    UpstreamError:
      description: A provider failed or returned an invalid response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Provider is temporarily unavailable
    ServiceUnavailable:
      description: A required provider is not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Provider is not configured
    GatewayTimeout:
      description: A provider request exceeded its configured timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Provider request timed out
    InternalError:
      description: An unexpected backend failure occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Unexpected server error
