[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dishly-retrieval"
version = "1.0.0"
description = "Local hybrid recipe retrieval service for Dishly"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "ollama>=0.6,<1",
    "Pillow>=11,<13",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.8,<8",
    # Starlette's current TestClient uses the maintained httpx2 compatibility
    # package; keeping this dev-only avoids shipping test transport code.
    "httpx2>=2.7,<3",
    "ruff>=0.12,<1",
]

[project.scripts]
dishly-retrieval = "dishly_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dishly_retrieval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["dishly_retrieval"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
